name: release

# Publishes nemo-agent-toolkit-hol-guard to PyPI when a version tag is pushed.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in this repo.
# The PyPI project must list this repository, this workflow file (release.yml)
# and the `pypi` environment as a trusted publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl pytest pytest-asyncio
          cd /tmp
          /tmp/wheel-env/bin/python -c "from importlib.metadata import entry_points; [e.load() for e in entry_points(group='nat.plugins') if e.name == 'nat_hol_guard'] or exit('nat_hol_guard entry point missing')"
          /tmp/wheel-env/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider --import-mode=importlib
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nemo-agent-toolkit-hol-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
